<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>drone viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1113; overflow: hidden; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 8px; left: 8px; z-index: 10;
    font: 11px/1.5 ui-monospace, monospace; color: #9fb2bd;
    background: rgba(0,0,0,.55); padding: 8px 10px; border-radius: 6px;
    white-space: pre;
  }
</style>
</head>
<body>
<div id="hud">loading…</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const hud = document.getElementById('hud');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1113);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.01, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xbfd4e2, 0x22282c, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 2.6);
key.position.set(3, 5, 4);
scene.add(key);
const rim = new THREE.DirectionalLight(0x88aaff, 1.4);
rim.position.set(-4, 1, -3);
scene.add(rim);

scene.add(new THREE.GridHelper(6, 24, 0x2a3438, 0x1b2226));
scene.add(new THREE.AxesHelper(1.2));

const root = new THREE.Group();
scene.add(root);

const params = new URLSearchParams(location.search);
const glbUrl = params.get('glb') || '../drone.glb';
const viewMode = params.get('view') || 'iso';

new GLTFLoader().load(glbUrl, (gltf) => {
  const model = gltf.scene;
  let triCount = 0, vertCount = 0;

  model.traverse((o) => {
    if (o.isMesh) {
      const g = o.geometry;
      if (!g.attributes.normal) g.computeVertexNormals();
      triCount += g.index ? g.index.count / 3 : g.attributes.position.count / 3;
      vertCount += g.attributes.position.count;
      o.material = new THREE.MeshStandardMaterial({
        color: 0xdfe6ea, metalness: 0.25, roughness: 0.45, flatShading: false,
      });
    }
  });

  root.add(model);

  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  hud.textContent = [
    `tris    ${triCount.toLocaleString()}`,
    `verts   ${vertCount.toLocaleString()}`,
    `size    ${size.x.toFixed(3)} ${size.y.toFixed(3)} ${size.z.toFixed(3)}`,
    `center  ${center.x.toFixed(3)} ${center.y.toFixed(3)} ${center.z.toFixed(3)}`,
    `min     ${box.min.x.toFixed(3)} ${box.min.y.toFixed(3)} ${box.min.z.toFixed(3)}`,
    `max     ${box.max.x.toFixed(3)} ${box.max.y.toFixed(3)} ${box.max.z.toFixed(3)}`,
  ].join('\n');

  const dist = Math.max(size.x, size.y, size.z) * 1.9;
  camera.position.set(dist * 0.75, dist * 0.5, dist * 0.75);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.copy(center);
  controls.update();

  const span = Math.max(size.x, size.y, size.z) * 0.62;
  const orthoCam = new THREE.OrthographicCamera(-span, span, span, -span, 0.01, 1000);
  const views = {
    top:   [center.x, center.y + 6, center.z, center.x, center.y, center.z],
    front: [center.x, center.y, center.z + 6, center.x, center.y, center.z],
    side:  [center.x + 6, center.y, center.z, center.x, center.y, center.z],
  };
  let renderCam = camera;
  if (views[viewMode]) {
    const [px, py, pz, tx, ty, tz] = views[viewMode];
    orthoCam.position.set(px, py, pz);
    orthoCam.up.set(0, viewMode === 'top' ? 0 : 1, viewMode === 'top' ? -1 : 0);
    orthoCam.lookAt(tx, ty, tz);
    orthoCam.updateProjectionMatrix();
    renderCam = orthoCam;
  }

  window.__box = { min: box.min.toArray(), max: box.max.toArray(), size: size.toArray(), center: center.toArray() };
  window.__ready = true;
  window.__renderCam = renderCam;

  if (params.get('markers') === '1') {
    const hubs = [
      [0.33, -0.05, 0.33],
      [0.33, -0.05, -0.37],
      [-0.75, -0.05, -0.37],
      [-0.75, -0.05, 0.33],
    ];
    const R = 0.26;
    for (const h of hubs) {
      const p = new THREE.Vector3(h[0], h[1], h[2]).sub(center);
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(R, 0.008, 8, 96),
        new THREE.MeshBasicMaterial({ color: 0xff3366 })
      );
      ring.position.copy(p);
      ring.rotation.x = Math.PI / 2;
      scene.add(ring);
      const dot = new THREE.Mesh(
        new THREE.SphereGeometry(0.02, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0x00ffcc })
      );
      dot.position.copy(p);
      scene.add(dot);
    }
  }
}, undefined, (err) => {
  hud.textContent = 'LOAD ERROR\n' + err;
  window.__error = String(err);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

(function loop() {
  requestAnimationFrame(loop);
  renderer.render(scene, window.__renderCam || camera);
})();
</script>
</body>
</html>
